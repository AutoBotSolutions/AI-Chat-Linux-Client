name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

  build-and-upload:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Chat-Linux-Client-x86_64.AppImage
            asset_name: chat-linux-client-x86_64.AppImage
          - os: ubuntu-latest
            artifact_name: chat-linux-client-source.tar.gz
            asset_name: chat-linux-client-source.tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build AppImage
      if: matrix.os == 'ubuntu-latest' && matrix.artifact_name == 'Chat-Linux-Client-x86_64.AppImage'
      run: |
        chmod +x scripts/build_appimage.sh
        ./scripts/build_appimage.sh

    - name: Create source archive
      if: matrix.artifact_name == 'chat-linux-client-source.tar.gz'
      run: |
        tar --exclude=.git --exclude=venv --exclude=__pycache__ --exclude=.pytest_cache \
            -czf chat-linux-client-source.tar.gz \
            --transform 's,^,chat-linux-client/,' \
            .

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        asset_content_type: application/octet-stream
